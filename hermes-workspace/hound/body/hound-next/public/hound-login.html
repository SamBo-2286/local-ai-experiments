<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HOUND — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@800&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070c02;
  --red:#ff4a2a;
  --red-glow:rgba(255,74,42,.55);
  --fill:#fa2e3a;
  --fill-glow:rgba(250,46,58,.55);
  --cream:#fdfda0;
  --cream-glow:rgba(253,253,160,.4);
}
*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0; height:100%;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  font-family:'Press Start 2P', monospace;
  overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:0;
  background:radial-gradient(ellipse at center, rgba(255,60,40,.05), transparent 70%);
  pointer-events:none;
}
.screen{
  position:relative;
  width:min(94vmin, 800px);
  aspect-ratio:1 / 1;
  background:var(--bg);
  container-type: inline-size;
}
.scanlines{
  position:absolute; inset:0; z-index:5; pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px,
    rgba(0,0,0,.16) 2px, rgba(0,0,0,.16) 3px
  );
  mix-blend-mode:multiply;
  opacity:.5;
  animation:flicker 6s infinite steps(60);
}
@keyframes flicker{
  0%,100%{ opacity:.46; }
  50%{ opacity:.56; }
  52%{ opacity:.4; }
}
.frame{
  position:absolute;
  top:3cqw; right:3.3cqw; bottom:4.1cqw; left:3.4cqw;
  border:0.4cqw solid var(--red);
  box-shadow:
    0 0 1cqw var(--red-glow),
    0 0 2.6cqw rgba(255,74,42,.16),
    inset 0 0 1.2cqw rgba(255,74,42,.08);
}
/* INSERT COIN block */
.insert-coin{
  position:absolute;
  left:3.27cqw; top:2.95cqw;
  width:21.61cqw; height:26.95cqw;
  border:0.4cqw solid var(--red);
  display:flex; flex-direction:column; justify-content:space-between;
  padding:1.9cqw 1.7cqw;
  color:var(--red);
  text-shadow:0 0 0.5cqw var(--red-glow);
}
.insert-coin .label{
  font-size:2.65cqw;
  line-height:1.32;
  flex:0 0 auto;
}
.insert-coin .meter{
  flex:0 0 1.35cqw;
  height:1.35cqw;
  background:var(--fill);
  box-shadow:0 0 0.6cqw var(--fill-glow);
}
.insert-coin .price{
  font-size:2.65cqw;
  line-height:1.32;
  flex:0 0 auto;
}
/* dog art */
.dog-wrap{
  position:absolute;
  top:7cqw; left:50%;
  transform:translateX(-50%);
  width:36cqw;
}
.dog-wrap img{
  width:100%; display:block;
  image-rendering:pixelated;
}
/* HOUND wordmark — center at 80.2cqw where 2000 text is */
.wordmark{
  position:absolute;
  left:19cqw; top:63.75cqw;
  width:70cqw;
  display:flex;
  align-items:center;
  justify-content:center;
}
.wordmark .word{
  font-family:'Poppins', sans-serif;
  font-weight:800;
  font-size:15.2cqw;
  line-height:1;
  color:var(--cream);
  letter-spacing:-0.01em;
  text-shadow:
    0.12cqw 0.12cqw 0 rgba(130,60,20,.55),
    0 0 1.4cqw var(--cream-glow);
  white-space:nowrap;
  }
  .wordmark .deg{
    margin-top:0.25cqw;
  line-height:1;
  font-family:'Press Start 2P', monospace;
  font-size:3.8cqw;
  letter-spacing:0.12em;
  color:var(--cream);
  text-shadow:0 0 1cqw var(--cream-glow);
}
.jp{
  position:absolute;
  left:65.2cqw; width:21.8cqw; top:78cqw;
  font-family:'Noto Sans JP', sans-serif;
  font-weight:700;
  font-size:2.35cqw;
  text-align:right;
  color:var(--cream);
  text-shadow:0 0 0.6cqw var(--cream-glow);
  opacity:.94;
}
/* login fields */
.field{
  position:absolute;
  left:26.87cqw; width:46.26cqw;
  display:flex; align-items:center;
  border:0.4cqw solid var(--red);
  padding:0 1.4cqw;
}
.field.username{ top:82.4cqw; height:5cqw; }
.field.password{ top:89cqw; height:5cqw; }
.field label{
  width:41%;
  flex:0 0 41%;
  color:var(--red);
  font-size:2.15cqw;
  text-shadow:0 0 0.5cqw var(--red-glow);
  white-space:nowrap;
}
.field .bar{
  position:relative;
  flex:1;
  height:66%;
  margin-right:6.8%;
  background:var(--fill);
  box-shadow:0 0 0.6cqw var(--fill-glow);
  display:flex; align-items:center;
}
.field .bar::before{
  content:"";
  width:0.35cqw;
  height:55%;
  margin-left:4%;
  background:#1a0000;
  opacity:.7;
}
.field input{
  position:absolute; inset:0;
  width:100%; height:100%;
  padding-left:9%;
  background:transparent; border:0; outline:0;
  font-family:'Press Start 2P', monospace;
  font-size:1.9cqw;
  color:#1a0000;
  caret-color:#1a0000;
}
.field input::placeholder{ color:transparent; }
.field:focus-within{ box-shadow:0 0 1cqw var(--red-glow); }
/* WK badge */
.badge{
  position:absolute;
  left:88.75cqw; top:88.45cqw;
  width:7cqw; height:6.5cqw;
  background:var(--fill);
  box-shadow:0 0 1cqw var(--fill-glow);
  display:flex; align-items:center; justify-content:center;
  color:#0a0300;
  font-family:'Poppins', sans-serif;
  font-weight:800;
  font-size:3.4cqw;
  letter-spacing:-0.03em;
}
.granted{
  position:absolute; inset:0; z-index:10;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg);
  color:var(--red);
  font-size:2.4cqw;
  text-shadow:0 0 1cqw var(--red-glow);
  opacity:0; pointer-events:none;
  transition:opacity .35s ease;
}
.granted.show{ opacity:1; pointer-events:auto; }
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
/* Debug: show container dimensions */
.screen::after{
  content:"v4-REF-MATCHED";
  position:absolute;
  top:1cqw; right:1cqw;
  color:rgba(255,255,255,0.1);
  font-size:1cqw;
}
</style>
</head>

    <form autocomplete="off" id="loginForm">
      <div class="field username">
        <label for="username">USERNAME:</label>
        <div class="bar"><input id="username" name="username" type="text" required></div>
      </div>
      <div class="field password">
        <label for="password">PASSWORD:</label>
        <div class="bar"><input id="password" name="password" type="password" required></div>
      </div>
      <button type="submit" class="sr-only">Log in</button>
    </form>

    <div class="badge">W/K</div>

    <div class="granted" id="granted">ACCESS GRANTED</div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const granted = document.getElementById('granted');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    if(!user || !pass) return;
    granted.classList.add('show');
    setTimeout(()=> granted.classList.remove('show'), 1400);
  });
</script>
